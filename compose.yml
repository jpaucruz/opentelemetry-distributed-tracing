services:

  order-db:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10


  inventory-db:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10


  kafka:
    image: apache/kafka:4.3.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    depends_on:
      - order-db
      - inventory-db


  debezium-connect:
    build:
      context: ./infrastructure/debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      ENABLE_OTEL: "true"
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/kafka/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: debezium-connect
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PROPAGATORS: tracecontext
      OTEL_INSTRUMENTATION_KAFKA_ENABLED: "false"
      CONNECT_PRODUCER_INTERCEPTOR_CLASSES: io.debezium.tracing.DebeziumTracingProducerInterceptor
    depends_on:
      - kafka
      - order-db
      - inventory-db


  debezium-init:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Debezium Connect..."

        until curl -fsS http://debezium-connect:8083/connectors > /dev/null; do
          sleep 2
        done

        echo "Debezium Connect is ready"

        if curl -fsS http://debezium-connect:8083/connectors/order-outbox-connector > /dev/null; then
          echo "order-outbox-connector already registered"
        else
          echo "Registering order-outbox-connector"
          curl -fsS -X POST -H "Content-Type: application/json" --data-binary @/connectors/order-outbox-connector.json http://debezium-connect:8083/connectors
        fi

        if curl -fsS http://debezium-connect:8083/connectors/inventory-outbox-connector > /dev/null; then
          echo "inventory-outbox-connector already registered"
        else
          echo "Registering inventory-outbox-connector"
          curl -fsS -X POST -H "Content-Type: application/json" --data-binary @/connectors/inventory-outbox-connector.json http://debezium-connect:8083/connectors
        fi

        echo "Debezium connectors initialized"
    depends_on:
      debezium-connect:
        condition: service_started
    volumes:
      - ./infrastructure/debezium:/connectors:ro


  inventory-service:
    build:
      context: ./services/inventory-service
    environment:
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    ports:
      - "8081:8081"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-collector:
        condition: service_started


  order-service:
    build:
      context: ./services/order-service
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/orders
      DB_USERNAME: orders
      DB_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    ports:
      - "8080:8080"
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_started
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./infrastructure/opentelemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4317"
      - "4318"