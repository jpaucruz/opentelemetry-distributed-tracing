openapi: 3.0.3

info:
    title: Inventory API
    description: API for inventory processing
    version: 1.0.0

tags:
    - name: Inventory
      description: Inventory operations

paths:
    /api/v1/inventory/reservations:
        post:
            tags:
                - Inventory
            summary: Reserve inventory for an order
            operationId: reserveInventory
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReserveInventoryRequest'
            responses:
                '201':
                    description: Inventory reserved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryReservationResponse'
                '400':
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '404':
                    description: Inventory not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '409':
                    description: Insufficient stock
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '500':
                    description: Unexpected internal error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
components:
    schemas:

        ReserveInventoryRequest:
            type: object
            required:
                - orderId
                - productId
                - quantity
            properties:
                orderId:
                    type: string
                    format: uuid
                productId:
                    type: integer
                    format: int64
                    minimum: 1
                quantity:
                    type: integer
                    format: int32
                    minimum: 1

        InventoryReservationResponse:
            type: object
            required:
                - reservationId
                - orderId
                - productId
                - quantity
                - status
            properties:
                reservationId:
                    type: string
                    format: uuid
                orderId:
                    type: string
                    format: uuid
                productId:
                    type: integer
                    format: int64
                quantity:
                    type: integer
                    format: int32
                status:
                    type: string
                    enum:
                        - RESERVED

        ErrorResponse:
            type: object
            additionalProperties: false
            required:
                - code
                - message
                - timestamp
                - path
            properties:
                code:
                    type: string
                message:
                    type: string
                timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-03T17:00:00Z'
                path:
                    type: string
                    example: /api/v1/inventory/reservations
