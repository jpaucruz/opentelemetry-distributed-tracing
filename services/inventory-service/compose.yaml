services:

    inventory-db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: inventory
            POSTGRES_USER: inventory
            POSTGRES_PASSWORD: inventory
        ports:
            - "5433:5432"
        volumes:
            - inventory-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
            interval: 5s
            timeout: 5s
            retries: 5

    inventory-service:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            DB_URL: jdbc:postgresql://inventory-db:5432/inventory
            DB_USERNAME: inventory
            DB_PASSWORD: inventory
        ports:
            - "8081:8081"
        depends_on:
            inventory-db:
                condition: service_healthy

volumes:
    inventory-db-data:
