openapi: 3.0.3

info:
    title: Order API
    description: API for order processing
    version: 1.0.0

tags:
    - name: Orders
      description: Order operations

paths:
    /api/v1/orders:
        post:
            tags:
                - Orders
            summary: Create an order
            operationId: createOrder
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateOrderRequest'
            responses:
                '201':
                    description: Order created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OrderResponse'
                '400':
                    description: Missing or malformed request parameters.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                code: INVALID_REQUEST
                                message: One or more request parameters are missing or invalid
                                timestamp: "2026-08-04T17:00:00Z"
                                path: "/api/v1/orders"
                '500':
                    description: Unexpected internal error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                code: INTERNAL_SERVER_ERROR
                                message: An unexpected internal error occurred.
                                timestamp: '2026-08-04T17:00:00Z'
                                path: /api/v1/orders

components:
    schemas:

        CreateOrderRequest:
            type: object
            required:
                - productId
                - quantity
            properties:
                productId:
                    type: integer
                    format: int64
                    minimum: 1
                    example: 1001
                quantity:
                    type: integer
                    format: int32
                    minimum: 1
                    example: 2

        OrderResponse:
            type: object
            required:
                - id
                - productId
                - quantity
                - status
            properties:
                id:
                    type: string
                    format: uuid
                productId:
                    type: integer
                    format: int64
                quantity:
                    type: integer
                    format: int32
                status:
                    type: string
                    enum:
                        - CREATED
        ErrorResponse:
            type: object
            additionalProperties: false
            required:
                - code
                - message
                - timestamp
                - path
            properties:
                code:
                    type: string
                    example: INVALID_REQUEST
                message:
                    type: string
                    example: Invalid request
                timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-03T17:00:00Z'
                path:
                    type: string
                    example: /api/v1/orders
