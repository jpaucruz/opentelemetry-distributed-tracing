services:

    order-db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: orders
            POSTGRES_USER: orders
            POSTGRES_PASSWORD: orders
        ports:
            - "5432:5432"
        volumes:
            - order-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
            interval: 5s
            timeout: 5s
            retries: 5

    order-service:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            DB_URL: jdbc:postgresql://order-db:5432/orders
            DB_USERNAME: orders
            DB_PASSWORD: orders
        ports:
            - "8080:8080"
        depends_on:
            order-db:
                condition: service_healthy

volumes:
    order-db-data:
